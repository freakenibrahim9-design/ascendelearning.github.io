#loader-overlay{position:fixed;inset:0;z-index:9999;background:#0b0b0e;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#loader-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-content{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;max-width:300px;width:100%}
.loader-icons{display:flex;gap:14px;justify-content:center;margin-bottom:4px}
.loader-icons .icon{font-size:28px;color:#0a84ff;animation:jump 1.4s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(10,132,255,.3))}
.loader-icons .icon:nth-child(2){animation-delay:.15s;color:#5ac8fa}
.loader-icons .icon:nth-child(3){animation-delay:.3s;color:#ff9f0a}
.loader-icons .icon:nth-child(4){animation-delay:.45s;color:#64d2ff}
.loader-icons .icon:nth-child(5){animation-delay:.6s;color:#ff6b6b}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.1)}60%{transform:translateY(-6px) scale(1.05)}}
.loader-title{font-size:1.6rem;font-weight:700;letter-spacing:.06em;background:linear-gradient(135deg,#0a84ff,#5ac8fa,#0a84ff);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer-text 2.4s ease-in-out infinite;font-family:-apple-system,'Inter',BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
@keyframes shimmer-text{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.loader-sub{color:#8e8e93;font-size:.7rem;letter-spacing:.15em;font-weight:400;margin-top:-2px}
.loader-error{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
.loader-error.show{display:flex}
.loader-error p{color:#ff453a;font-size:.8rem;font-weight:500;margin:0}
.loader-error .retry-loader-btn{background:#0a84ff;border:none;padding:6px 20px;border-radius:20px;font-weight:500;font-size:.8rem;color:#fff;cursor:pointer}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;font-size:13px;background:#0b0b0b;color:#f1f5f9;display:flex;flex-direction:column}

.header{position:fixed;top:16px;left:16px;right:16px;z-index:200;display:flex;justify-content:space-between;align-items:center;pointer-events:none}

.login-btn{display:none}.login-btn.show{display:flex}

#chat{flex:1;overflow-y:auto;padding:80px 16px 100px 16px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}

@keyframes blink{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

.premium-modal .btn{padding:10px 14px;border-radius:12px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.premium-modal .btn-primary{background:linear-gradient(135deg,#f5b342,#e68a2e);color:#1a1a1a}

.modal-overlay{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.8);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}

async function fetchGroqApiKeys(){
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${GROQ_KEY_SHEET_ID}/values/${encodeURIComponent(GROQ_KEY_SHEET_NAME)}?key=${API_KEY}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json=await res.json();
    if(!json.values||json.values.length<2) throw new Error('API key sheet empty');
    const headers=json.values[0].map(h=>h.trim().toLowerCase());
    const ki=headers.indexOf('apikey');
    if(ki===-1) throw new Error('apikey column missing');
    const keys=[];
    for(let i=1; i<json.values.length; i++){
        const key=(json.values[i][ki]||'').trim();
        if(key && !keys.includes(key)) keys.push(key);
    }
    if(keys.length===0) throw new Error('No API keys found in sheet');
    return keys;
}

function fetchSubscriptions(){
    if(SUBSCRIPTION_SHEET_ID==='PASTE_YOUR_SUBSCRIPTION_SHEET_ID_HERE'){subscriptionData=[];return Promise.resolve([]);}
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SUBSCRIPTION_SHEET_ID}/values/${encodeURIComponent(SUBSCRIPTION_SHEET_NAME)}?key=${API_KEY}`;
    return fetch(url).then(r=>{if(!r.ok) throw new Error(`HTTP ${r.status}`);return r.json();}).then(json=>{
        if(!json.values||json.values.length<2){subscriptionData=[];return [];}
        const headers=json.values[0];
        subscriptionData=json.values.slice(1).map(row=>{const o={};headers.forEach((h,i)=>{o[h.trim()]=(row[i]||'').trim();});return o;});
        return subscriptionData;
    }).catch(()=>{subscriptionData=[];return [];});
}
function parseDate(str){
    if(!str) return null;
    const p=str.split(/[\/\-.]/); if(p.length!==3) return null;
    let d,m,y; const a=parseInt(p[0]),b=parseInt(p[1]),c=parseInt(p[2]);
    if(a>12&&b<=12){d=a;m=b-1;y=c;} else if(b>12&&a<=12){d=b;m=a-1;y=c;} else {d=a;m=b-1;y=c;}
    const dt=new Date(y,m,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==m||dt.getDate()!==d) return null;
    return dt;
}
function getTodayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

            userState=d.userState||null;premiumCode=d.premiumCode||null;
            requestCount=d.requestCount||0;lastRequestDate=d.lastRequestDate||null;
            const today=getTodayStr();

    }catch(e){}
    userState=null;premiumCode=null;requestCount=0;lastRequestDate=getTodayStr();saveState();
}

function validateCodeAgainstSheet(code){
    if(!subscriptionData||subscriptionData.length===0) return {valid:false,reason:'No subscription data'};
    const t=code.trim();
    const m=subscriptionData.find(r=>(r.secret_code||'').trim().toLowerCase()===t.toLowerCase());
    if(!m) return {valid:false,reason:'Invalid code'};
    const exp=parseDate((m.expiry_date||'').trim());
    if(!exp) return {valid:false,reason:'Invalid expiry'};
    if(exp<=new Date()) return {valid:false,reason:'Expired',expiry:m.expiry_date};
    return {valid:true,code:t,expiry:m.expiry_date};
}

function normalizeMathDelimiters(text){

    let f=text.replace(/\$\$([\s\S]*?)\$\$/g,(m,c)=>'$'+c.trim()+'$');
    f=f.replace(/\$\$\$([\s\S]*?)\$\$\$/g,(m,c)=>'$'+c.trim()+'$');
    f=f.replace(/\\\[([\s\S]*?)\\\]/g,(m,c)=>'$'+c.trim()+'$');
    f=f.replace(/\\\(([\s\S]*?)\\\)/g,(m,c)=>'$'+c.trim()+'$');
    return f;
}
function splitCombinedEquations(text){
    const regex=/\$([^$]*?)\$/g;let m;const ranges=[];
    while((m=regex.exec(text))!==null) ranges.push({start:m.index,end:m.index+m[0].length,content:m[1]});
    let result=text;
    for(let i=ranges.length-1;i>=0;i--){
        const r=ranges[i];const parts=[];let cur='';let depth=0;
        for(const ch of r.content){
            if(ch==='{'||ch==='(') depth++;
            else if(ch==='}'||ch===')') depth--;
            else if(ch===','&&depth===0){parts.push(cur.trim());cur='';continue;}
            cur+=ch;
        }
        if(cur.trim()) parts.push(cur.trim());
        if(parts.length<=1) continue;
        const nm=parts.map(p=>'$'+p+'$').join(' ');
        result=result.substring(0,r.start)+nm+result.substring(r.end);
    }
    return result;
}
function fixLatexMistakes(text){
    if(!text) return text;
    let f=text;
    f=f.replace(/\\cdotp/g,'\\cdot');
    f=normalizeMathDelimiters(f);
    f=f.replace(/;\s*\\longrightarrow\s*;/g,' \\longrightarrow ');
    return f;
}
function ensureMathDelimiters(text){
    if(!text) return text;
    const processed=normalizeMathDelimiters(text);
    return processed.split('\n').map(line=>{
        const t=line.trim();
        if(!t||t.includes('$')) return line;
        if(/\\[a-zA-Z]+/.test(t)&&!t.includes('=')&&!t.includes('http')) return '$'+t+'$';
        return line;
    }).join('\n');
}
function renderLatex(element){
    if(!element) return;
    if(typeof renderMathInElement==='undefined'){setTimeout(()=>renderLatex(element),200);return;}
    try{
        renderMathInElement(element,{
            delimiters:[{left:'$',right:'$',display:false}],
            skipTags:['pre','code','textarea','script','style'],
            throwOnError:false,errorColor:'#ff6b6b'
        });
        element.querySelectorAll('.katex-error').forEach(err=>{
            const raw=err.getAttribute('data-latex')||err.textContent;
            if(raw) err.parentNode.replaceChild(document.createTextNode('$'+raw+'$'),err);
        });
    }catch(e){}
}
function highlightCode(c){if(typeof Prism!=='undefined') c.querySelectorAll('pre code').forEach(b=>{try{Prism.highlightElement(b);}catch(e){}});}
function addCodeCopyButtons(container){
    container.querySelectorAll('pre').forEach(pre=>{
        if(pre.querySelector('.copy-btn')) return;
        const btn=document.createElement('button');btn.className='copy-btn';btn.textContent='Copy';
        btn.onclick=()=>{const t=pre.innerText;navigator.clipboard.writeText(t).then(()=>{btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',2000);});};
        pre.style.position='relative';pre.appendChild(btn);
    });
}
function addMessageActions(botDiv,rawText){
    const a=document.createElement('div');a.className='message-actions';
    const cp=document.createElement('button');cp.innerHTML='<i class="fas fa-copy"></i> Copy';
    cp.onclick=()=>{navigator.clipboard.writeText(rawText).then(()=>showToast('Copied!',1500,'success'));};
    a.appendChild(cp);
    botDiv.appendChild(a);
}
function wrapTables(html){
    if(!html) return html;
    const div=document.createElement('div');div.innerHTML=html;
    div.querySelectorAll('table').forEach(table=>{
        if(table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
        const wrapper=document.createElement('div');wrapper.className='table-scroll';
        table.parentNode.insertBefore(wrapper,table);wrapper.appendChild(table);
    });
    return div.innerHTML;
}
function escapeBracesOutsideMath(text){
    const segs=[];let i=0;
    const regex=/\$([^$]*?)\$/g;
    const processed=text.replace(regex,(m,c)=>{const ph=`__M${i}__`;segs.push({ph,content:c});i++;return ph;});
    const esc=processed.replace(/\{/g,'&#123;').replace(/\}/g,'&#125;');
    let r=esc;
    segs.forEach(s=>{r=r.replace(s.ph,`$${s.content}$`);});
    return r;
}
function processBotText(t){
    if(!t) return '';
    let c=t;
    c=c.replace(/xx([^x]*)xx/g,'**$1**');
    c=fixLatexMistakes(c);
    c=ensureMathDelimiters(c);
    c=splitCombinedEquations(c);
    c=escapeBracesOutsideMath(c);
    return c;
}
function formatMarkdown(text){
    if(!text) return "";
    if(typeof marked!=='undefined'){
        marked.setOptions({breaks:true,gfm:true,pedantic:false,smartypants:true,headerIds:false,mangle:false});
        let raw=marked.parse(text);
        raw=wrapTables(raw);
        if(typeof DOMPurify!=='undefined'){
            return DOMPurify.sanitize(raw,{ADD_ATTR:['target','loading'],ADD_TAGS:['iframe']});
        }
        return raw;
    }
    return escapeHtml(text).replace(/\n/g,'<br>');
}

/* ═══════ STREAM (with multi-key rotation) ═══════ */
async function streamGroqWithCallback(modelId,messagesArray,onToken,signal){
    const keys = CONFIG.GROQ_API_KEYS;
    if(!keys || keys.length === 0) throw new Error("No API keys available");

    let lastError = null;
    let response = null;
    let successKeyIdx = -1;

    for(let attempt = 0; attempt < keys.length; attempt++){
        const keyIdx = (keyIndex + attempt) % keys.length;
        const key = keys[keyIdx];
        let r;
        try{
            r = await fetch(CONFIG.GROQ_API_URL,{
                method:"POST",
                headers:{"Authorization":`Bearer ${key}`,"Content-Type":"application/json"},
                body:JSON.stringify({model:modelId,messages:messagesArray,temperature:0.7,max_tokens:8192,stream:true}),
                signal:signal
            });
        }catch(fetchErr){
            lastError = fetchErr;
            continue;
        }

        if(r.ok){
            response = r;
            successKeyIdx = keyIdx;
            break;
        }

        let errorText = "";
        try { errorText = await r.text(); } catch(e) {}

        if([401,403,429,500,502,503,504].includes(r.status)){
            lastError = new Error(r.status===429||r.status===503 ? "QUOTA_EXCEEDED" : `HTTP ${r.status}: ${errorText.slice(0,200)}`);
            continue;
        }
        throw new Error(`HTTP ${r.status}: ${errorText.slice(0,200)}`);
    }

    if(!response) throw lastError || new Error("All API keys failed");

    keyIndex = (successKeyIdx + 1) % keys.length;

    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value,{stream:true});
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for(const line of lines){
            const trimmed = line.trim();
            if(!trimmed || trimmed === "data: [DONE]") continue;
            if(trimmed.startsWith("data: ")){
                try{
                    const parsed = JSON.parse(trimmed.slice(6));
                    const delta = parsed.choices?.[0]?.delta?.content;
                    if(delta) onToken(delta);
                }catch(e){}
            }
        }
    }
}

/* ═══════ FETCH MODELS (with multi-key rotation) ═══════ */
function isVisionModelId(id){
    const lower=id.toLowerCase();
    return lower.includes('vision') || lower.includes('llama-4-scout') || lower.includes('llama-4-maverick') || (lower.includes('llama-3.2') && lower.includes('vision'));
}
async function fetchModels(){
    try{
        const keys = CONFIG.GROQ_API_KEYS;
        if(!keys || keys.length === 0) throw new Error("No API keys available");

        let data = null;
        let lastErr = null;
        for(let attempt = 0; attempt < keys.length; attempt++){
            const keyIdx = (keyIndex + attempt) % keys.length;
            const key = keys[keyIdx];
            let r;
            try{
                r = await fetch(CONFIG.GROQ_MODELS_URL,{headers:{"Authorization":`Bearer ${key}`}});
            }catch(e){
                lastErr = e;
                continue;
            }
            if(!r.ok){
                lastErr = new Error(`HTTP ${r.status}`);
                continue;
            }
            try{
                data = await r.json();
            }catch(e){
                lastErr = e;
                continue;
            }
            keyIndex = (keyIdx + 1) % keys.length;
            break;
        }
        if(!data) throw lastErr || new Error("Failed to fetch models with any API key");

        const allModels=data.data||[];
        const visionRaw=allModels.filter(m=>isVisionModelId(m.id));
        const textRaw=allModels.filter(m=>{
            const id=m.id.toLowerCase();
            if(isVisionModelId(id)) return false;
            return (id.includes('openai')||id==='groq-compound'||id==='groq/compound'||
                (id.includes('llama')&&!id.includes('guard')&&!id.includes('prompt'))||
                id.includes('qwen')) &&
                !id.includes('compound-mini')&&!id.includes('whisper')&&!id.includes('canopy');
        });
        textRaw.sort((a,b)=>{
            const pa=a.id.includes('openai')?1:a.id==='groq-compound'||a.id==='groq/compound'?2:a.id.includes('llama')?3:4;
            const pb=b.id.includes('openai')?1:b.id==='groq-compound'||b.id==='groq/compound'?2:b.id.includes('llama')?3:4;
            return pa-pb||a.id.localeCompare(b.id);
        });
        visionRaw.sort((a,b)=>{
            const pa=a.id.includes('llama-4-scout')?1:a.id.includes('llama-4-maverick')?2:3;
            const pb=b.id.includes('llama-4-scout')?1:b.id.includes('llama-4-maverick')?2:3;
            return pa-pb||a.id.localeCompare(b.id);
        });
        availableModels=textRaw.map((m,idx)=>({id:m.id,displayName:`Freaken ${idx+1}`,isVision:false}));
        visionModels=visionRaw.map((m,idx)=>({id:m.id,displayName:`Vision ${idx+1}`,isVision:true}));
        if(availableModels.length>0){currentModelId=availableModels[0].id;currentModelDisplay=availableModels[0].displayName;}
        else if(visionModels.length>0){currentModelId=visionModels[0].id;currentModelDisplay=visionModels[0].displayName;}
    }catch(err){
        throw err;
    }
}

/* ═══════ PART PARSER (Robust, 2-part cap) ═══════ */
function extractParts(itemText){
    if(!itemText) return [];

    const taskMatch = itemText.match(/(?:^|\n)[\s*_#-]*Task[\s*_#-]*:?[\s*_#-]*\n/i);
    let body = taskMatch ? itemText.substring(taskMatch.index + taskMatch[0].length) : itemText;

    const re = /(?:^|\n)[\s*_#-]*\(([a-z])\)[\s*_#-]*/gi;
    let found = [];
    let m;

    while((m = re.exec(body)) !== null){
        const label = m[1].toLowerCase();
        if(['a','b','c','d'].includes(label)){
            found.push({ label: label, markerStart: m.index, markerEnd: m.index + m[0].length });
        }
    }

    if(found.length === 0 && taskMatch){
        body = itemText;
        re.lastIndex = 0;
        while((m = re.exec(body)) !== null){
            const label = m[1].toLowerCase();
            if(['a','b','c','d'].includes(label)){
                found.push({ label: label, markerStart: m.index, markerEnd: m.index + m[0].length });
            }
        }
    }

    if(found.length === 0) return [];

    const uniqueFound = [];
    const seen = new Set();
    for(const f of found){
        if(!seen.has(f.label)){
            seen.add(f.label);
            uniqueFound.push(f);
        }
    }

    const parts = [];
    for(let i = 0; i < uniqueFound.length; i++){
        const end = i + 1 < uniqueFound.length ? uniqueFound[i + 1].markerStart : body.length;
        const text = body.substring(uniqueFound[i].markerEnd, end).trim();
        if(text.length > 0) parts.push({ label: uniqueFound[i].label, text });
    }

    // Hard cap at two parts — the vision analyzer accepts a maximum of 2 images.
    // If the model ever produces more than (a) and (b), fold the excess into (b).
    if(parts.length > 2){
        const partA = parts.find(p=>p.label === 'a');
        const partB = parts.find(p=>p.label === 'b');
        const extras = parts.filter(p=>p.label !== 'a' && p.label !== 'b');
        if(partB && extras.length > 0){
            partB.text += '\n\n' + extras.map(p=>p.text).join('\n\n');
        }
        return [partA, partB].filter(Boolean);
    }

    return parts;
}

function renderPartImagePreview(label,dataUrl){
    const wrap=document.getElementById(`imgPreviewWrap-${label}`);
    const attachBtn=document.querySelector(`[data-attach-for="${label}"]`);
    const status=document.querySelector(`[data-status="${label}"]`);
    const block=document.querySelector(`[data-part-block="${label}"]`);
    if(!wrap) return;
    wrap.innerHTML='';
    if(!dataUrl){
        if(attachBtn) attachBtn.classList.remove('active');
        if(status) status.textContent='Awaiting photo';
        if(block) block.classList.remove('has-image');
        updateSubmitAllButton();
        return;
    }
    const p=document.createElement('div');p.className='img-preview';
    p.style.width='100px';p.style.height='100px';
    const im=document.createElement('img');im.src=dataUrl;im.alt='answer';

    rm.addEventListener('click',ev=>{ev.stopPropagation();delete partImages[label];renderPartImagePreview(label,null);});
    p.appendChild(im);p.appendChild(rm);
    wrap.appendChild(p);
    if(attachBtn) attachBtn.classList.add('active');
    if(status) status.textContent='✓ Photo attached';
    if(block) block.classList.add('has-image');
    updateSubmitAllButton();

/* ═══════ SILENT VISION EXTRACTION ═══════ */
async function silentVisionExtract(imageDataUrl, itemText){
    let visionList = visionModels.slice();
    if(visionList.length === 0) return null;
    const VISION_EXTRACTION_PROMPT = `You are an expert OCR and handwriting transcription assistant for UNEB UACE examinations.

Read the uploaded image of a student's answer and transcribe EVERYTHING into clean Markdown.

RULES:
1. Transcribe ALL text verbatim.
2. Transcribe ALL mathematics using $...$ inline math.
3. Transcribe ALL chemical formulae: $CO_2$, $H_2SO_4$.
4. Transcribe ALL tables as Markdown tables.
5. Transcribe ALL diagrams by describing axes, labels, values, shapes.
6. Note unclear parts as "[unclear: best guess is ...]".
7. Do NOT mark or grade. Only transcribe.
8. Output ONLY the transcribed content starting with "# Transcribed Candidate Answer".

If completely unreadable, reply exactly: "UNREADABLE_IMAGE".`;

    for(const model of visionList){
        const messages = [
            { role:'system', content: VISION_EXTRACTION_PROMPT },
            { role:'user', content: [
                { type:'text', text: `Examination item the student answered:\n\n${itemText||'(item unavailable)'}\n\nTranscribe everything in the student's answer image below.` },
                { type:'image_url', image_url: { url: imageDataUrl } }
            ]}
        ];
        let extracted='';
        try{ await streamGroqWithCallback(model.id, messages, (token)=>{extracted+=token;}, null); }
        catch(err){continue;}
        const trimmed=extracted.trim();
        if(!trimmed||trimmed.length<10) continue;
        if(trimmed.toUpperCase().includes('UNREADABLE_IMAGE')) continue;
        return trimmed;
    }
    return null;
}

/* ═══════ FILE INPUT ═══════ */
fileInput.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f) return;
    if(!f.type.startsWith('image/')){showToast('Please select an image.',3000,'warning');return;}
    if(f.size>6*1024*1024){showToast('Image too large (max 6 MB).',3000,'warning');return;}
    const reader=new FileReader();
    reader.onload=()=>{
        const label=currentAttachTargetLabel;
        if(!label){showToast('No part selected.',3000,'warning');return;}
        partImages[label]={dataUrl:reader.result};
        renderPartImagePreview(label,reader.result);
        showToast(`📷 Photo attached for Part (${label}).`,'success',2000);
    };
    reader.readAsDataURL(f);
    fileInput.value='';
});

premiumSubmitBtn.addEventListener('click',handlePremiumSubmit);
premiumCodeInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handlePremiumSubmit();}});
premiumWhatsAppBtn.addEventListener('click',()=>{

/* ═══════ INIT ═══════ */
async function init(){
    try{
        CONFIG.GROQ_API_KEYS=await fetchGroqApiKeys();
        await Promise.all([fetchSubscriptions(),fetchModels()]);
        loaderOverlay.classList.add('hidden');
        loadState();
        await refreshUserState();
        showWelcome();
        setTimeout(()=>{if(!setupOverlay.classList.contains('active')&&!premiumOverlay.classList.contains('active')) openSetup();},400);
    }catch(err){
        console.error(err);
        loaderError.classList.add('show');
        loaderOverlay.classList.remove('hidden');
    }
}
init();
</script>
