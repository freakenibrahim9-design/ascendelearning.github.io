<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>E-Library</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<style>
/* ══════════════ BASE ══════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --purple:#9b72cb;
  --card:#1c1c1e;
  --card2:#2c2c2e;
  --card3:#3a3a3c;
  --sep:rgba(255,255,255,.08);
  --sep2:rgba(255,255,255,.12);
  --label:#ffffff;
  --label2:rgba(235,235,245,.62);
  --label3:rgba(235,235,245,.32);
  --r-lg:22px;
  --r-md:16px;
  --r-sm:12px;
  --ease:cubic-bezier(.22,1,.36,1);
}
html{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Arial,sans-serif;
  background:#000;
  color:var(--label);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  padding-bottom:130px;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(900px 500px at 50% -12%, rgba(10,132,255,.16), transparent 62%),
    radial-gradient(700px 420px at 90% 8%, rgba(155,114,203,.12), transparent 60%),
    radial-gradient(600px 400px at 5% 30%, rgba(48,209,88,.07), transparent 60%);
  pointer-events:none;
  z-index:0;
}

/* ══════════════ iOS STICKY HEADER ══════════════ */
.ios-header{
  position:sticky;
  top:0;
  z-index:200;
  padding:calc(9px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(12,12,14,.66);
  backdrop-filter:saturate(180%) blur(26px);
  -webkit-backdrop-filter:saturate(180%) blur(26px);
  border-bottom:.5px solid var(--sep);
}
.header-inner{max-width:720px;margin:0 auto;}

.search-field{
  display:flex;align-items:center;gap:9px;
  height:38px;padding:0 12px;
  background:rgba(118,118,128,.24);
  border-radius:11px;
  transition:background .22s var(--ease),box-shadow .22s var(--ease);
}
.search-field:focus-within{
  background:rgba(118,118,128,.34);
  box-shadow:0 0 0 3.5px rgba(10,132,255,.25);
}
.search-field > i{color:var(--label2);font-size:15px;}
.search-field input{
  flex:1;background:none;border:0;outline:0;
  color:#fff;font-size:17px;font-weight:400;
  font-family:inherit;min-width:0;
}
.search-field input::placeholder{color:var(--label2);}
.clear-btn{
  background:none;border:0;color:var(--label2);
  font-size:16px;cursor:pointer;padding:2px;display:none;
  transition:transform .15s;
}
.clear-btn.show{display:block;}
.clear-btn:active{transform:scale(.85);}

/* ══════════════ MAIN ══════════════ */
main{
  position:relative;z-index:1;
  max-width:720px;margin:0 auto;
  padding:0 16px;
}
.large-title{
  font-size:34px;line-height:1.08;font-weight:800;
  letter-spacing:-1px;
  margin:20px 2px 4px;
  background:linear-gradient(120deg,#fff 30%,#9bb8ff 70%,#c9a6ff);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.page-sub{
  color:var(--label2);font-size:13.5px;font-weight:500;
  margin:0 2px 20px;letter-spacing:-.1px;
  display:flex;align-items:center;gap:7px;
}
.page-sub .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:blink 2.2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ══════════════ FOLDER CARD ══════════════ */
.folder-card{
  background:var(--card);
  border-radius:var(--r-lg);
  margin-bottom:13px;
  overflow:hidden;
  border:.5px solid var(--sep);
  box-shadow:0 12px 32px rgba(0,0,0,.42);
  animation:cardIn .5s var(--ease) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(16px) scale(.975);}
  to{opacity:1;transform:none;}
}

.main-header{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;
  cursor:pointer;user-select:none;
  transition:background .18s;
}
.main-header:active{background:var(--card2);}

.folder-badge{
  width:42px;height:42px;flex:0 0 42px;
  border-radius:13px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#0a84ff,#5e5ce6);
  box-shadow:0 8px 20px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.35);
  font-size:18px;color:#fff;
}
.main-header .title{
  flex:1;font-size:16px;font-weight:650;
  letter-spacing:-.35px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.count-pill{
  font-size:11px;font-weight:700;color:var(--label2);
  background:rgba(118,118,128,.26);
  padding:3px 9px;border-radius:20px;
  letter-spacing:.2px;flex:0 0 auto;
}
.chev{
  color:var(--label3);font-size:13px;
  transition:transform .35s var(--ease);
  flex:0 0 auto;
}
.folder-card.open > .main-header .chev{transform:rotate(90deg);}

.sub-wrap{
  max-height:0;overflow:hidden;
  transition:max-height .5s var(--ease);
}
.folder-card.open > .sub-wrap{max-height:9000px;}
.sub-list{padding:0 10px 12px;display:flex;flex-direction:column;gap:9px;}

/* ── Sub folder ── */
.sub-card{
  background:var(--card2);
  border-radius:var(--r-md);
  overflow:hidden;
  border:.5px solid var(--sep);
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.sub-header{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;
  cursor:pointer;user-select:none;
  transition:background .18s;
}
.sub-header:active{background:var(--card3);}
.sub-badge{
  width:32px;height:32px;flex:0 0 32px;
  border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(145deg,#9b72cb,#d96570);
  box-shadow:0 6px 16px rgba(155,114,203,.32), inset 0 1px 0 rgba(255,255,255,.3);
  font-size:14px;color:#fff;
}
.sub-header .title{
  flex:1;font-size:14px;font-weight:600;letter-spacing:-.25px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sub-card.open > .sub-header .chev{transform:rotate(90deg);}

.doc-wrap{
  max-height:0;overflow:hidden;
  transition:max-height .45s var(--ease);
}
.sub-card.open > .doc-wrap{max-height:6000px;}
.doc-list{padding:2px 9px 11px;display:flex;flex-direction:column;gap:9px;}

/* ══════════════ DOC CARD ══════════════ */
.doc-card{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.055);
  border:.5px solid var(--sep2);
  border-radius:var(--r-md);
  padding:10px;
  transition:transform .18s var(--ease),background .18s;
  animation:cardIn .4s var(--ease) both;
}
.doc-card:active{transform:scale(.985);background:rgba(255,255,255,.1);}

.doc-icon{
  position:relative;
  width:54px;height:54px;flex:0 0 54px;
  border-radius:15px;
  display:grid;place-items:center;
  background:linear-gradient(150deg,#ff453a,#ff9f0a 88%);
  box-shadow:0 10px 22px rgba(255,69,58,.32), inset 0 1px 0 rgba(255,255,255,.4);
  font-size:25px;color:#fff;
  overflow:hidden;
}
.doc-icon::after{
  content:"";
  position:absolute;top:-70%;left:-70%;
  width:55%;height:240%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:rotate(24deg);
  animation:shine 3.6s ease-in-out infinite;
}
@keyframes shine{0%{left:-70%}55%,100%{left:140%}}

.doc-info{flex:1;min-width:0;}
.doc-name{
  font-size:14.5px;font-weight:640;letter-spacing:-.25px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.25;
}
.doc-meta{
  font-size:11px;color:var(--label2);
  margin-top:4px;display:flex;align-items:center;gap:6px;
  font-weight:500;letter-spacing:.1px;
}
.doc-meta i{font-size:10px;opacity:.8;}

.doc-actions{display:flex;gap:8px;flex:0 0 auto;}
.act{
  width:42px;height:42px;border-radius:50%;
  border:0;display:grid;place-items:center;
  font-size:15px;cursor:pointer;
  transition:transform .15s var(--ease),background .2s,box-shadow .2s;
  position:relative;
}
.act:active{transform:scale(.86);}
.act.preview{
  color:#6cb2ff;
  background:rgba(10,132,255,.16);
  box-shadow:inset 0 0 0 .5px rgba(10,132,255,.32);
}
.act.preview:active{background:rgba(10,132,255,.3);}
.act.download{
  color:#5ce07f;
  background:rgba(48,209,88,.16);
  box-shadow:inset 0 0 0 .5px rgba(48,209,88,.32);
}
.act.download:active{background:rgba(48,209,88,.3);}

/* ══════════════ SKELETON ══════════════ */
.sk-card{
  background:var(--card);
  border-radius:var(--r-lg);
  margin-bottom:13px;
  border:.5px solid var(--sep);
  padding:14px;
  animation:pulse 1.5s ease-in-out infinite;
}
.sk-row{display:flex;align-items:center;gap:12px;}
.sk-badge{width:42px;height:42px;border-radius:13px;background:var(--card3);flex:0 0 42px;}
.sk-line{height:14px;border-radius:6px;background:var(--card3);flex:1;}
.sk-line.short{width:45%;flex:0 0 45%;}
.sk-doc{display:flex;align-items:center;gap:12px;margin-top:14px;margin-left:8px;}
.sk-doc .sk-badge{width:46px;height:46px;border-radius:13px;flex:0 0 46px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}

/* ══════════════ STATES ══════════════ */
.state{
  text-align:center;padding:56px 24px;
  color:var(--label2);font-size:14px;
}
.state i{
  font-size:42px;display:block;margin-bottom:16px;
  background:linear-gradient(140deg,#0a84ff,#9b72cb);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.state p{font-size:16px;font-weight:650;color:#fff;margin-bottom:6px;letter-spacing:-.3px;}
.state span{font-size:13px;color:var(--label2);}
.retry-btn{
  margin-top:18px;padding:11px 30px;border-radius:24px;border:0;
  background:var(--blue);color:#fff;font-size:14.5px;font-weight:650;
  cursor:pointer;font-family:inherit;
  box-shadow:0 8px 22px rgba(10,132,255,.4);
  transition:transform .15s var(--ease);
}
.retry-btn:active{transform:scale(.93);}

/* ══════════════ HIDDEN (search) ══════════════ */
.hidden-main,.hidden-sub,.hidden-doc{display:none !important;}

/* ══════════════════════════════════════════════════════════
   DOCUMENT VIEWER OVERLAY
   ══════════════════════════════════════════════════════════ */
#doc-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #0b0b0b;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: auto;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
}
#doc-overlay.active {
    display: flex;
}

.doc-stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    touch-action: auto;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
}
.doc-stage iframe {
    width: 100%;
    height: 100%;
    border: 0 !important;
    background: #000;
    touch-action: auto;
    -webkit-overflow-scrolling: touch;
}

/* ══════════════════════════════════════════════════════════
   DROPDOWN PANEL — BLACK BACKGROUND
   ══════════════════════════════════════════════════════════ */
.doc-top-right-box {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 54px;
    background: #000000;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: auto;
    overflow: hidden;
}

.doc-close {
    width: 54px;
    height: 44px;
    background: #000000;
    border: none;
    color: #ffffff;
    font-size: 16px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0;
    transition: background 0.2s;
    flex: 0 0 auto;
}
.doc-close:hover {
    background: rgba(255, 255, 255, 0.12);
}
.doc-close:active {
    transform: scale(0.9);
}
.doc-close i {
    display: inline-block;
    transition: transform 0.35s cubic-bezier(.22,1,.36,1);
}
.doc-top-right-box.open .doc-close i {
    transform: rotate(180deg);
}

.doc-dropdown-menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: #000000;
    max-height: 0;
    padding: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: max-height 0.42s cubic-bezier(.22,1,.36,1),
                opacity 0.28s ease,
                padding 0.32s ease;
}
.doc-top-right-box.open .doc-dropdown-menu {
    max-height: 240px;
    padding: 6px 0 14px;
    opacity: 1;
    pointer-events: auto;
}

.dd-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    display: grid;
    place-items: center;
    font-size: 17px;
    cursor: pointer;
    color: #fff;
    flex: 0 0 auto;
    transition: transform 0.15s;
}
.dd-btn:active { transform: scale(0.9); }

.dd-download {
    background: linear-gradient(145deg, #30d158, #1f9e42);
}
.dd-back {
    background: linear-gradient(145deg, #8e8e93, #5a5a5e);
}
/* ── AI button: solid blue, no glow, no animation, SVG icon inside ── */
.dd-ai {
    background: #0a84ff;
    box-shadow: none;
    animation: none !important;
}
.dd-ai:active {
    background: #0060df;
}
/* Inline SVG icon so it always renders (no Pro-only font glyph needed) */
.dd-ai-icon{
    width:22px;
    height:22px;
    display:block;
    pointer-events:none;
}
.dd-ai-icon path{
    fill:#ffffff;
}

.doc-loader {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #0b0b0b;
    pointer-events: none;
    transition: opacity 0.3s ease;
}
.doc-loader.hidden {
    opacity: 0;
    pointer-events: none;
}
.doc-loader .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top: 3px solid #0a84ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.doc-loader span{
  font-size:12.5px;color:var(--label2);font-weight:500;letter-spacing:.2px;
}

.doc-error {
    position: absolute;
    inset: 0;
    z-index: 8;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.85);
    color: #ff6b6b;
    padding: 24px;
    text-align: center;
    gap: 6px;
}
.doc-error i {
    font-size: 40px;
    margin-bottom: 12px;
}
.doc-error span {
    font-size: 16px;
    font-weight: 500;
    color: #fff;
}
.doc-error small{
  font-size:12.5px;color:var(--label2);max-width:280px;line-height:1.5;
}
.doc-error .retry-doc-btn {
    margin-top: 16px;
    padding: 8px 24px;
    border-radius: 24px;
    border: none;
    background: var(--blue);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}
.doc-error .retry-doc-btn:active {
    transform: scale(0.94);
}

/* ══════════════ RESPONSIVE ══════════════ */
@media (max-width: 480px) {
    .doc-top-right-box {
        top: 10px;
        right: 10px;
        width: 46px;
    }
    .doc-close {
        width: 46px;
        height: 40px;
        font-size: 14px;
    }
    .dd-btn {
        width: 42px;
        height: 42px;
        font-size: 15px;
    }
    .dd-ai-icon{
        width:19px;
        height:19px;
    }
}

/* ══════════════════════════════════════════════════════════
   FLOATING AI BUTTON — SOLID BLUE, NO GLOW, ICON INSIDE
   ══════════════════════════════════════════════════════════ */
.ai-fab{
  position:fixed;
  right:5px;
  bottom:calc(5px + env(safe-area-inset-bottom));
  width:68px;height:68px;
  border:0;background:transparent;
  border-radius:50%;
  display:grid;place-items:center;
  cursor:pointer;
  z-index:900;
  padding:0;
  animation:aiDance 3s ease-in-out infinite;
  transform-origin:50% 60%;
  will-change:transform;
}
.ai-fab:active{animation-play-state:paused;}

.ai-core{
  position:relative;
  width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;
  background:#0a84ff;
  box-shadow:none;
  overflow:hidden;
}
.ai-fab:active .ai-core{
  background:#0060df;
}

.ai-icon{
  position:relative;
  z-index:2;
  width:28px;height:28px;
  animation:none !important;
  filter:none !important;
}
.ai-icon path{fill:#ffffff;}
.ai-icon .g1{opacity:1;}

@keyframes aiDance{
  0%,100%{transform:translateY(0) rotate(0deg) scale(1);}
  12%{transform:translateY(-8px) rotate(-8deg) scale(1.07);}
  25%{transform:translateY(0) rotate(0deg) scale(1);}
  38%{transform:translateY(-5px) rotate(7deg) scale(1.05);}
  52%{transform:translateY(0) rotate(-2deg) scale(1);}
  66%{transform:translateY(-3px) rotate(4deg) scale(1.03);}
  82%{transform:translateY(0) rotate(0deg) scale(1);}
}

/* ══════════════ TOAST ══════════════ */
.toast{
  position:fixed;left:50%;bottom:96px;
  transform:translate(-50%,22px);
  display:flex;align-items:center;gap:9px;
  max-width:88vw;
  padding:12px 20px;
  background:rgba(28,28,30,.92);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border:.5px solid var(--sep2);
  border-radius:26px;
  font-size:13.5px;font-weight:600;letter-spacing:-.15px;
  color:#fff;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,transform .35s var(--ease);
  z-index:2000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast i{color:var(--green);font-size:15px;}
.toast .toast-spin{
  width:15px;height:15px;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:var(--blue);
  animation:spin .7s linear infinite;
  flex:0 0 15px;
}

/* ══════════════ RESPONSIVE (main) ══════════════ */
@media (max-width:400px){
  .doc-icon{width:48px;height:48px;flex:0 0 48px;font-size:22px;border-radius:13px;}
  .act{width:38px;height:38px;font-size:14px;}
  .doc-card{gap:10px;padding:9px;}
  .doc-name{font-size:13.5px;}
  .large-title{font-size:30px;}
  .ai-fab{width:62px;height:62px;}
  .ai-core{width:51px;height:51px;}
  .ai-icon{width:25px;height:25px;}
}
@media (min-width:768px){
  .header-inner,main{max-width:740px;}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
</style>
</head>

<body>

<!-- ══════════ iOS STICKY SEARCH BAR ══════════ -->
<header class="ios-header">
  <div class="header-inner">
    <div class="search-field">
      <i class="fas fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search folders & documents" autocomplete="off" spellcheck="false" />
      <button class="clear-btn" id="clearSearch" aria-label="Clear"><i class="fas fa-circle-xmark"></i></button>
    </div>
  </div>
</header>

<!-- ══════════ CONTENT ══════════ -->
<main>
  <h1 class="large-title">E-Library</h1>
  <div class="page-sub"><span class="dot"></span><span id="statLine">Loading your library…</span></div>
  <div id="appContent"></div>
</main>

<!-- ══════════ DOCUMENT VIEWER ══════════ -->
<div id="doc-overlay">
  <div class="doc-stage">
    <div class="doc-loader" id="docLoader">
      <div class="spinner"></div>
      <span>Loading document…</span>
    </div>

    <iframe id="docIframe" src="" allowfullscreen></iframe>

    <div class="doc-top-right-box" id="docDropdownBox">
      <button class="doc-close" id="closeDoc" aria-label="Menu">
        <i class="fas fa-chevron-down"></i>
      </button>
      <div class="doc-dropdown-menu" id="docDropdownMenu">
        <button class="dd-btn dd-download" id="ddDownload" aria-label="Download">
          <i class="fas fa-download"></i>
        </button>
        <button class="dd-btn dd-back" id="ddBack" aria-label="Back">
          <i class="fas fa-arrow-left"></i>
        </button>
        <!-- AI button with inline SVG sparkle icon (always renders) -->
        <button class="dd-btn dd-ai" id="ddAi" aria-label="AI Assistant">
          <svg class="dd-ai-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 1.6 L13.85 9.15 L21.4 12 L13.85 14.85 L12 22.4 L10.15 14.85 L2.6 12 L10.15 9.15 Z"/>
            <path d="M19.6 3.2 L20.3 5.6 L22.8 6.3 L20.3 7 L19.6 9.4 L18.9 7 L16.4 6.3 L18.9 5.6 Z" opacity=".85"/>
            <path d="M5.1 15.3 L5.7 17.2 L7.6 17.8 L5.7 18.4 L5.1 20.3 L4.5 18.4 L2.6 17.8 L4.5 17.2 Z" opacity=".85"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="doc-error" id="docError">
      <i class="fas fa-exclamation-triangle"></i>
      <span>Failed to load document</span>
      <small>Please try again in a moment.</small>
      <button class="retry-doc-btn" id="retryDoc">Retry</button>
    </div>
  </div>
</div>

<!-- ══════════ FLOATING AI BUTTON ══════════ -->
<button class="ai-fab" id="aiFab" aria-label="Open AI Assistant">
  <span class="ai-core">
    <svg class="ai-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 1.6 L13.85 9.15 L21.4 12 L13.85 14.85 L12 22.4 L10.15 14.85 L2.6 12 L10.15 9.15 Z"/>
      <path class="g1" d="M19.6 3.2 L20.3 5.6 L22.8 6.3 L20.3 7 L19.6 9.4 L18.9 7 L16.4 6.3 L18.9 5.6 Z"/>
      <path class="g1" d="M5.1 15.3 L5.7 17.2 L7.6 17.8 L5.7 18.4 L5.1 20.3 L4.5 18.4 L2.6 17.8 L4.5 17.2 Z"/>
    </svg>
  </span>
</button>

<!-- ══════════ TOAST ══════════ -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════ */
const API_KEY        = 'AIzaSyDEcLBhFHz7kH46_YwB2cQ5S-90j8e7L-g';
const SPREADSHEET_ID = '18ujifIyZMm1n44_4LSMrPg57k9dFf28DubDdG8Q4yJQ';
const SHEET_NAME     = 'Sheet1';

/* ══════════════════════════════════════════════════════════
   DOM
   ══════════════════════════════════════════════════════════ */
const appContent     = document.getElementById('appContent');
const searchInput    = document.getElementById('searchInput');
const clearSearch    = document.getElementById('clearSearch');
const statLine       = document.getElementById('statLine');
const toastEl        = document.getElementById('toast');

const docOverlay        = document.getElementById('doc-overlay');
const closeDocBtn       = document.getElementById('closeDoc');
const docIframe         = document.getElementById('docIframe');
const docLoader         = document.getElementById('docLoader');
const docError          = document.getElementById('docError');
const retryDocBtn       = document.getElementById('retryDoc');
const docDropdownBox    = document.getElementById('docDropdownBox');
const ddDownload        = document.getElementById('ddDownload');
const ddBack            = document.getElementById('ddBack');
const ddAi              = document.getElementById('ddAi');
const aiFab             = document.getElementById('aiFab');

let currentDocURL  = '';
let currentDocName = '';
let loaderFallback = null;

/* ══════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════ */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let toastTimer = null;
function showToast(msg, icon = 'circle-check', spin = false, duration = 2200){
  toastEl.innerHTML = spin
    ? `<span class="toast-spin"></span><span>${esc(msg)}</span>`
    : `<i class="fas fa-${icon}"></i><span>${esc(msg)}</span>`;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  if (duration > 0) toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

/* ══════════════════════════════════════════════════════════
   LINK ENGINE  —  preview/view link  ➜  direct download link
   ══════════════════════════════════════════════════════════ */
function extractFileId(url){
  if (!url) return null;
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]{10,})/);
  if (m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if (m) return m[1];
  m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  if (m) return m[1];
  m = url.match(/^([a-zA-Z0-9_-]{25,})$/);
  if (m) return m[1];
  return null;
}

function toPreviewUrl(url){
  const id = extractFileId(url);
  if (id) return `https://drive.google.com/file/d/${id}/preview?rm=minimal&hl=en`;
  return url;
}

function toDirectDownloadUrl(url){
  const id = extractFileId(url);
  if (id) return `https://drive.google.com/uc?export=download&id=${id}&confirm=t`;
  return url;
}

function safeFileName(name){
  let n = String(name || 'document').trim().replace(/[\\/:*?"<>|]+/g,'_');
  if (!/\.[a-z0-9]{2,5}$/i.test(n)) n += '.pdf';
  return n;
}

/* ══════════════════════════════════════════════════════════
   DOWNLOAD  (in-page, never navigates away)
   ══════════════════════════════════════════════════════════ */
async function downloadDoc(url, name){
  if (!url){ showToast('No download link available','triangle-exclamation',false,2600); return; }

  const direct   = toDirectDownloadUrl(url);
  const filename = safeFileName(name);

  showToast('Preparing download…', '', true, 0);

  try{
    const res = await fetch(direct, { credentials:'omit', mode:'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const blob = await res.blob();
    if (blob.size < 1024 && /text\/html/i.test(blob.type)) throw new Error('invalid-response');

    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);

    showToast('Saved to your device','circle-check',false,2400);
  } catch(err){
    iframeDownload(direct, filename);
    showToast('Starting in sec…','circle-check',false,2400);
  }
}

function iframeDownload(url, filename){
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;width:0;height:0;border:0;opacity:0;pointer-events:none;';
  iframe.src = url;
  document.body.appendChild(iframe);
  setTimeout(() => iframe.remove(), 90000);
}

/* ══════════════════════════════════════════════════════════
   SHEET FETCH
   ══════════════════════════════════════════════════════════ */
function fetchSheetData(){
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(SHEET_NAME)}?key=${API_KEY}`;
  return fetch(url)
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(json => {
      if (!json.values || json.values.length < 2) throw new Error('Sheet is empty');
      const headers = json.values[0];
      return json.values.slice(1).map(row => {
        const obj = {};
        headers.forEach((h, i) => { obj[String(h).trim()] = String(row[i] ?? '').trim(); });
        return obj;
      });
    })
    .catch(err => { throw new Error('Failed to load data: ' + err.message); });
}

/* ══════════════════════════════════════════════════════════
   TREE
   ══════════════════════════════════════════════════════════ */
function buildTree(rows){
  const tree = {};
  rows.forEach(row => {
    const main    = (row.main_folder || 'Uncategorized').trim();
    const sub     = (row.sub_folder  || 'General').trim();
    const docName = (row.doc_file    || '').trim();
    const docURL  = (row.doc_url     || '').trim();
    if (!docName || !docURL) return;

    tree[main]           = tree[main] || {};
    tree[main][sub]      = tree[main][sub] || [];
    tree[main][sub].push({ name: docName, url: docURL });
  });
  return tree;
}

/* ══════════════════════════════════════════════════════════
   RENDER TREE
   ══════════════════════════════════════════════════════════ */
function renderTree(tree){
  const mainKeys = Object.keys(tree).sort();
  if (!mainKeys.length){
    return `<div class="state"><i class="fas fa-folder-open"></i><p>No documents found</p><span>Your library has no valid entries yet.</span></div>`;
  }

  let html = '';

  mainKeys.forEach((main, mi) => {
    const subs = tree[main];
    const subKeys = Object.keys(subs).sort();
    let total = 0;
    subKeys.forEach(s => total += subs[s].length);

    html += `<section class="folder-card open" style="animation-delay:${mi * 45}ms">
      <div class="main-header">
        <div class="folder-badge"><i class="fas fa-folder"></i></div>
        <div class="title">${esc(main)}</div>
        <span class="count-pill">${total}</span>
        <i class="fas fa-chevron-right chev"></i>
      </div>
      <div class="sub-wrap"><div class="sub-list">`;

    subKeys.forEach(sub => {
      const docs = subs[sub];

      html += `<div class="sub-card">
        <div class="sub-header">
          <div class="sub-badge"><i class="fas fa-folder-open"></i></div>
          <div class="title">${esc(sub)}</div>
          <span class="count-pill">${docs.length}</span>
          <i class="fas fa-chevron-right chev"></i>
        </div>
        <div class="doc-wrap"><div class="doc-list">`;

      docs.forEach((doc, di) => {
        html += `<div class="doc-card" style="animation-delay:${Math.min(di * 35, 260)}ms"
                      data-url="${esc(doc.url)}" data-name="${esc(doc.name)}">
            <div class="doc-icon"><i class="fas fa-file-pdf"></i></div>
            <div class="doc-info">
              <div class="doc-name">${esc(doc.name)}</div>
              <div class="doc-meta"><i class="fas fa-book-open"></i> Ascend E-library · PDF</div>
            </div>
            <div class="doc-actions">
              <button class="act preview" data-act="preview" aria-label="Preview"><i class="fas fa-eye"></i></button>
              <button class="act download" data-act="download" aria-label="Download"><i class="fas fa-arrow-down"></i></button>
            </div>
          </div>`;
      });

      html += `</div></div></div>`;
    });

    html += `</div></div></section>`;
  });

  return html;
}

/* ══════════════════════════════════════════════════════════
   SKELETON
   ══════════════════════════════════════════════════════════ */
function renderSkeleton(){
  let html = '';
  for (let i = 0; i < 4; i++){
    html += `<div class="sk-card" style="animation-delay:${i * 120}ms">
      <div class="sk-row">
        <div class="sk-badge"></div>
        <div class="sk-line"></div>
        <div class="sk-line short"></div>
      </div>
      <div class="sk-doc">
        <div class="sk-badge"></div>
        <div class="sk-line"></div>
      </div>
      <div class="sk-doc">
        <div class="sk-badge"></div>
        <div class="sk-line short"></div>
      </div>
    </div>`;
  }
  return html;
}

/* ══════════════════════════════════════════════════════════
   LOAD
   ══════════════════════════════════════════════════════════ */
let isLoading = false;

function loadData(){
  if (isLoading) return;
  isLoading = true;
  appContent.innerHTML = renderSkeleton();
  statLine.textContent = 'Loading your library…';

  fetchSheetData()
    .then(rows => {
      const tree = buildTree(rows);
      appContent.innerHTML = renderTree(tree);

      const mains = Object.keys(tree).length;
      let docs = 0;
      Object.values(tree).forEach(s => Object.values(s).forEach(d => docs += d.length));
      statLine.textContent = `${docs} document${docs === 1 ? '' : 's'} · ${mains} folder${mains === 1 ? '' : 's'}`;

      const q = searchInput.value.trim();
      if (q) filterSearch(q);
    })
    .catch(err => {
      console.error(err);
      statLine.textContent = 'Offline';
      appContent.innerHTML = `<div class="state">
        <i class="fas fa-wifi"></i>
        <p>Connection problem</p>
        <span>We couldn't reach the library.</span>
        <br><button class="retry-btn" id="retryLoadBtn">Retry</button>
      </div>`;
      document.getElementById('retryLoadBtn')?.addEventListener('click', loadData);
    })
    .finally(() => { isLoading = false; });
}

/* ══════════════════════════════════════════════════════════
   EVENT DELEGATION
   ══════════════════════════════════════════════════════════ */
appContent.addEventListener('click', e => {
  const actBtn = e.target.closest('.act');
  if (actBtn){
    e.stopPropagation();
    const card = actBtn.closest('.doc-card');
    if (!card) return;
    const url  = card.dataset.url;
    const name = card.dataset.name;
    if (actBtn.dataset.act === 'preview') openDoc(url, name);
    else downloadDoc(url, name);
    return;
  }

  const docCard = e.target.closest('.doc-card');
  if (docCard){ openDoc(docCard.dataset.url, docCard.dataset.name); return; }

  const mainHeader = e.target.closest('.main-header');
  if (mainHeader){ mainHeader.closest('.folder-card')?.classList.toggle('open'); return; }

  const subHeader = e.target.closest('.sub-header');
  if (subHeader){ subHeader.closest('.sub-card')?.classList.toggle('open'); return; }
});

/* ══════════════════════════════════════════════════════════
   SEARCH
   ══════════════════════════════════════════════════════════ */
function filterSearch(query){
  const q = query.toLowerCase().trim();

  document.querySelectorAll('.folder-card').forEach(main => {
    let mainVisible = false;

    const mainTitle = (main.querySelector('.main-header .title')?.textContent || '').toLowerCase();
    const mainHit   = q && mainTitle.includes(q);

    main.querySelectorAll('.sub-card').forEach(sub => {
      let subVisible = false;

      const subTitle = (sub.querySelector('.sub-header .title')?.textContent || '').toLowerCase();
      const subHit   = q && subTitle.includes(q);

      sub.querySelectorAll('.doc-card').forEach(doc => {
        const docTitle = (doc.querySelector('.doc-name')?.textContent || '').toLowerCase();
        const hit = !q || mainHit || subHit || docTitle.includes(q);
        doc.classList.toggle('hidden-doc', !hit);
        if (hit) subVisible = true;
      });

      sub.classList.toggle('hidden-sub', !subVisible);
      if (q && subVisible) sub.classList.add('open');
      if (subVisible) mainVisible = true;
    });

    main.classList.toggle('hidden-main', !mainVisible);
    if (mainVisible) main.classList.add('open');
  });
}

searchInput.addEventListener('input', function(){
  const val = this.value;
  clearSearch.classList.toggle('show', val.length > 0);

  clearTimeout(window._st);
  window._st = setTimeout(() => {
    const q = val.trim();
    if (!q){
      document.querySelectorAll('.folder-card').forEach(m => {
        m.classList.remove('hidden-main');
        m.classList.add('open');
        m.querySelectorAll('.sub-card').forEach(s => {
          s.classList.remove('hidden-sub');
          s.querySelectorAll('.doc-card').forEach(d => d.classList.remove('hidden-doc'));
        });
      });
    } else {
      filterSearch(q);
    }
  }, 140);
});

clearSearch.addEventListener('click', () => {
  searchInput.value = '';
  clearSearch.classList.remove('show');
  searchInput.dispatchEvent(new Event('input'));
  searchInput.focus();
});

/* ══════════════════════════════════════════════════════════
   VIEWER
   ══════════════════════════════════════════════════════════ */
function setLoaderVisible(v){
  docLoader.classList.toggle('hidden', !v);
}

function openDoc(url, name){
  if (!url){ showToast('No preview link available','triangle-exclamation',false,2400); return; }

  currentDocURL  = url;
  currentDocName = name || 'Document';

  docDropdownBox.classList.remove('open');

  docError.style.display  = 'none';
  setLoaderVisible(true);

  docIframe.src = toPreviewUrl(url);
  docOverlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  clearTimeout(loaderFallback);
  loaderFallback = setTimeout(() => setLoaderVisible(false), 12000);
}

function closeDoc(){
  clearTimeout(loaderFallback);
  docOverlay.classList.remove('active');
  docDropdownBox.classList.remove('open');
  docIframe.src = '';
  docError.style.display = 'none';
  setLoaderVisible(false);
  document.body.style.overflow = '';
  currentDocURL = '';
  currentDocName = '';
}

docIframe.addEventListener('load', () => {
  if (!docIframe.src) return;
  clearTimeout(loaderFallback);
  setLoaderVisible(false);
  docError.style.display = 'none';
});

docIframe.addEventListener('error', () => {
  clearTimeout(loaderFallback);
  setLoaderVisible(false);
  docError.style.display = 'flex';
});

retryDocBtn.addEventListener('click', () => {
  if (!currentDocURL) return;
  docError.style.display = 'none';
  setLoaderVisible(true);
  docIframe.src = '';
  setTimeout(() => {
    docIframe.src = toPreviewUrl(currentDocURL);
    clearTimeout(loaderFallback);
    loaderFallback = setTimeout(() => setLoaderVisible(false), 12000);
  }, 250);
});

/* ══════════════════════════════════════════════════════════
   DROPDOWN MENU
   ══════════════════════════════════════════════════════════ */
closeDocBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  docDropdownBox.classList.toggle('open');
});

ddDownload.addEventListener('click', (e) => {
  e.stopPropagation();
  docDropdownBox.classList.remove('open');
  if (currentDocURL) downloadDoc(currentDocURL, currentDocName);
});

ddBack.addEventListener('click', (e) => {
  e.stopPropagation();
  docDropdownBox.classList.remove('open');
  closeDoc();
});

ddAi.addEventListener('click', (e) => {
  e.stopPropagation();
  docDropdownBox.classList.remove('open');
  window.location.href = 'ai.html';
});

document.addEventListener('click', (e) => {
  if (!docDropdownBox.contains(e.target)) {
    docDropdownBox.classList.remove('open');
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && docOverlay.classList.contains('active')) closeDoc();
});

/* ══════════════════════════════════════════════════════════
   FLOATING AI BUTTON
   ══════════════════════════════════════════════════════════ */
aiFab.addEventListener('click', () => {
  aiFab.style.animation = 'none';
  void aiFab.offsetWidth;
  window.location.href = 'ai.html';
});

/* ══════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════ */
loadData();
</script>

</html>
